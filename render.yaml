# Render Blueprint (free plan): New > Blueprint, pick this repository, then fill in OPENROUTER_API_KEY.
# The free plan has no persistent disk: accounts, groups and chats are lost when the service
# restarts, sleeps (after ~15 min idle) or redeploys. For lasting data, use a paid plan with the
# disk block below, or move server/store.ts to a hosted database.
services:
  - type: web
    name: crosscheck
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false        # asked for when the Blueprint is created; never committed
      - key: LLM_MODEL
        value: openai/gpt-5-mini
      - key: PERSONAL_LLM_MODEL
        value: openai/gpt-5-mini
      - key: LLM_REASONING_EFFORT
        value: low
      - key: DATA_DIR
        value: /data
    # Paid plans only:
    # disk:
    #   name: crosscheck-data
    #   mountPath: /data
    #   sizeGB: 1
